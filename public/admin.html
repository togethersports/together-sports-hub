<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Together Sports · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --display:"League Spartan",system-ui,sans-serif;
  --body:"Montserrat",system-ui,sans-serif;
  --bg:#F5F4EC;--surface:#FFFFFF;--surface-2:#ECEFE1;
  --border:#E2E5D4;--text:#1f223f;--muted:#7d816f;
  --accent:#285400;--accent-soft:#E7F1D7;--accent-ink:#FFFFFF;--lime:#87cb4a;
  --danger:#b3261e;--danger-soft:#f7e4e2;
  --radius:12px;
  --shadow-sm:0 1px 2px rgba(31,34,63,.04),0 1px 3px rgba(31,34,63,.05);
  --shadow:0 4px 16px rgba(31,34,63,.07);
  --shadow-lg:0 18px 50px rgba(31,34,63,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit}

/* Layout */
.app{height:100vh;display:grid;grid-template-columns:248px 1fr;overflow:hidden}
.ts-main{display:flex;flex-direction:column;min-width:0;height:100vh}
.ts-content{flex:1;overflow-y:auto;background:var(--bg)}
.ts-content-inner{padding:26px 32px 64px;max-width:1340px;margin:0 auto;animation:viewfade .26s ease}
@keyframes viewfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view{display:flex;flex-direction:column;gap:22px}

/* Login overlay */
.login-wrap{position:fixed;inset:0;background:rgba(20,24,18,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:var(--surface);border-radius:20px;padding:40px 44px;box-shadow:var(--shadow-lg);width:380px;text-align:center}
.login-logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;margin:0 auto 20px}
.login-card h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.5px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13.5px;margin-bottom:28px}
.login-card input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;outline:none;margin-bottom:12px;transition:border-color .14s,box-shadow .14s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-card button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;transition:background .14s}
.login-card button:hover{background:color-mix(in oklab,var(--accent) 90%,#000)}
.login-err{color:var(--danger);font-size:12.5px;margin-top:8px}

/* Sidebar */
.ts-sb{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:22px 16px 18px;overflow-y:auto}
.ts-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 22px}
.ts-logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.ts-brandname{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.1}
.ts-brandsub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.ts-nav{display:flex;flex-direction:column;gap:3px}
.ts-navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);background:none;border:0;font-weight:500;font-size:13.5px;text-align:left;transition:background .14s,color .14s;width:100%}
.ts-navitem:hover{background:color-mix(in oklab,var(--text) 5%,transparent);color:var(--text)}
.ts-navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ts-nav-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:auto}
.ts-sbfoot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.ts-sbcard{border-radius:14px;padding:15px 15px 14px;background:var(--accent-soft);color:var(--accent)}
.ts-sbcard-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.85}
.ts-sbcard-v{font-family:var(--display);font-weight:700;font-size:18px;margin:6px 0 10px;letter-spacing:-.2px}
.ts-sbcard-bar{height:6px;border-radius:99px;background:color-mix(in oklab,currentColor 18%,transparent);overflow:hidden}
.ts-sbcard-bar span{display:block;height:100%;border-radius:99px;background:currentColor;transition:width .4s}
.ts-logout{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;background:none;border:1.5px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;width:100%;transition:all .14s}
.ts-logout:hover{border-color:var(--danger);color:var(--danger)}

/* Topbar */
.ts-top{display:flex;align-items:center;gap:16px;padding:13px 32px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--surface) 75%,var(--bg));flex:0 0 auto;z-index:5}
.ts-top-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.3px}
.ts-topright{display:flex;align-items:center;gap:12px;margin-left:auto}
.ts-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;border:none}
.ts-avatar{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;flex:0 0 auto}
.ts-username{font-size:13px;font-weight:600}
.ts-userrole{font-size:11px;color:var(--muted)}

/* Page header */
.ts-pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ts-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em;text-transform:uppercase}
.ts-h1{font-family:var(--display);font-weight:700;font-size:31px;letter-spacing:-.6px;margin:9px 0 6px;line-height:1.02}
.ts-lede{color:var(--muted);font-size:14px;max-width:60ch}
.ts-pagehead-actions{display:flex;gap:10px;flex:0 0 auto}

/* Buttons */
.ui-btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding:10px 17px;border-radius:11px;border:1px solid transparent;white-space:nowrap;transition:transform .12s,box-shadow .12s,background .14s;cursor:pointer}
.ui-btn:hover{transform:translateY(-1px)}
.ui-btn:active{transform:none}
.ui-btn--primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in oklab,var(--accent) 28%,transparent)}
.ui-btn--primary:hover{background:color-mix(in oklab,var(--accent) 90%,#000)}
.ui-btn--ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.ui-btn--ghost:hover{border-color:color-mix(in oklab,var(--accent) 40%,var(--border))}
.ui-btn--danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.ui-btn--sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.ui-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Stats */
.ts-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ts-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.ts-stat-label{font-size:12.5px;font-weight:600;color:var(--muted)}
.ts-stat-value{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-1px;line-height:.95}
.ts-stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px}
.ts-stat-delta.warn{color:#92400e;background:#fef3c7}
.ts-stat-sub{font-size:11.5px;color:var(--muted);font-weight:500}

/* Cards */
.ts-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.ts-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px}
.ts-card-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.3px}
.ts-card-sub{font-size:12px;color:var(--muted);margin-top:3px}
.ts-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:12.5px;background:none;border:0;cursor:pointer;transition:gap .14s}
.ts-link:hover{gap:8px}
.ts-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.ts-side{display:flex;flex-direction:column;gap:16px}

/* Tables */
.ts-tablecard{overflow-x:auto}
.ts-table{width:100%;border-collapse:collapse;font-size:13px}
.ts-table th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
.ts-table td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.ts-table tr:last-child td{border-bottom:none}
.ts-table tr:hover td{background:color-mix(in oklab,var(--accent-soft) 30%,transparent)}
.ts-table-empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}

/* Tags / badges */
.ui-tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.ui-tag--green{background:var(--accent-soft);color:var(--accent)}
.ui-tag--gray{background:var(--surface-2);color:var(--muted)}
.ui-tag--amber{background:#fef3c7;color:#92400e}
.ui-tag--red{background:var(--danger-soft);color:var(--danger)}
.ui-tag--blue{background:#dbeafe;color:#1d4ed8}

/* Bar rows (chapter stats) */
.ts-chlist{display:flex;flex-direction:column;gap:11px;padding:0 20px 18px}
.ts-chrow{display:grid;grid-template-columns:120px 1fr 36px;align-items:center;gap:11px}
.ts-chname{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-chtrack{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ts-chfill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.ts-chn{font-family:var(--display);font-weight:700;font-size:13px;text-align:right}

/* Filter bar */
.ts-filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ts-filterbar select,.ts-filterbar input[type=date]{padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:var(--surface);outline:none;color:var(--text)}
.ts-filterbar select:focus,.ts-filterbar input:focus{border-color:var(--accent)}
.ts-filterbar .ui-btn{padding:8px 16px;font-size:13px}

/* Coach roster */
.ts-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ts-coachcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;display:flex;flex-direction:column;gap:14px}
.ts-coachcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in oklab,var(--accent) 30%,var(--border))}
.ts-coachcard-top{display:flex;align-items:center;gap:12px}
.ts-coachcard-name{font-family:var(--display);font-weight:700;font-size:16px}
.ts-coachcard-chap{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:2px}
.ts-coachcard-foot{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}
.ts-coachcard-foot strong{color:var(--text);font-family:var(--display);font-size:15px}

/* Avatar */
.ui-avatar{border-radius:99px;display:inline-grid;place-items:center;font-family:var(--display);font-weight:700;flex:0 0 auto;font-size:14px;color:#fff;background:var(--accent)}

/* Modal */
.ui-modal-backdrop{position:fixed;inset:0;background:rgba(20,24,18,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:100;animation:bdfade .18s ease}
@keyframes bdfade{from{opacity:0}to{opacity:1}}
.ui-modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;animation:popfade .2s ease}
.ui-modal--wide{max-width:680px}
@keyframes popfade{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.ui-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.ui-modal-title{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.3px}
.ui-modal-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.ui-modal-body{padding:20px 22px;overflow-y:auto}
.ui-modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--border)}
.ui-close{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;padding:2px;cursor:pointer}
.ui-close:hover{color:var(--text)}

/* Forms */
.ts-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ts-form-full{grid-column:1/-1}
.ui-field{display:flex;flex-direction:column;gap:6px}
.ui-label{font-size:12.5px;font-weight:600;color:var(--text)}
.ui-input{font-size:13.5px;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .14s,box-shadow .14s;width:100%}
.ui-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ui-select-wrap{position:relative}
.ui-select-wrap select{appearance:none;width:100%;font-size:13.5px;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 34px 10px 12px;outline:none;cursor:pointer;transition:border-color .14s,box-shadow .14s}
.ui-select-wrap select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ui-select-arrow{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:10px}
.ui-hint{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Toast */
.ui-toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
.ui-toast{display:flex;align-items:center;gap:10px;background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;animation:toastin .25s ease}
.ui-toast-ok::before{content:"✓";color:var(--lime);font-weight:800}
.ui-toast-err::before{content:"✕";color:#ff9b8a;font-weight:800}
@keyframes toastin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Gallery */
.ts-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ts-gphoto{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s;display:flex;flex-direction:column}
.ts-gphoto:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ts-gphoto img{width:100%;height:160px;object-fit:cover;display:block}
.ts-gphoto-meta{padding:11px 14px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.ts-gphoto-cap{font-weight:600;font-size:13px}
.ts-gphoto-sub{font-size:11.5px;color:var(--muted)}
.ts-gphoto-actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.lightbox-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center}
.lightbox-wrap img{max-width:90vw;max-height:85vh;border-radius:10px}
.lightbox-close{position:absolute;top:18px;right:22px;color:#fff;background:none;border:none;font-size:2rem;cursor:pointer}

/* Testimonials */
.ts-testimonials{display:flex;flex-direction:column;gap:14px}
.ts-tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.ts-tquote{font-size:14px;line-height:1.6;color:var(--text);font-style:italic;margin-bottom:10px}
.ts-tquote::before{content:'"';font-family:var(--display);font-size:1.4em;color:var(--accent);line-height:0;vertical-align:-.3em;margin-right:2px}
.ts-tmeta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ts-tactions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:0 0 auto}
.ts-toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.ts-toggle{width:40px;height:22px;border-radius:99px;border:none;background:#d5d8c6;position:relative;cursor:pointer;transition:background .18s;flex:0 0 auto}
.ts-toggle span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .18s}
.ts-toggle.on{background:var(--accent)}
.ts-toggle.on span{transform:translateX(18px)}

/* Upload drop */
.ts-uploaddrop{border:2px dashed var(--border);border-radius:14px;min-height:140px;display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:border-color .14s,background .14s;background:var(--surface-2);text-align:center;padding:20px}
.ts-uploaddrop:hover{border-color:var(--accent);background:var(--accent-soft)}
.ts-uploaddrop img{width:100%;height:180px;object-fit:cover}

/* Settings */
.ts-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ts-setcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm)}
.ts-setcard h3{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.2px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}

/* Participants */
.ts-ptable{width:100%;font-size:13px;border-collapse:collapse}
.ts-ptable th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.ts-ptable td{padding:9px 12px;border-bottom:1px solid var(--border)}

@media(max-width:1080px){
  .ts-stats{grid-template-columns:1fr 1fr}
  .ts-grid{grid-template-columns:1fr}
  .ts-settings-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .ts-sb{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Utilities ─────────────────────────────────────────────────────────────────
const TOKEN = () => localStorage.getItem('ts_tok') || '';
const api = (url, opts = {}) => {
  opts.headers = { ...(opts.headers || {}), 'x-admin-token': TOKEN() };
  return fetch(url, opts).then(r => r.json());
};
const fmt = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
const initials = n => n ? n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '?';
const av = (name, size=36) => (
  <div className="ui-avatar" style={{width:size,height:size,fontSize:size*0.38}}>
    {initials(name)}
  </div>
);

// ── Toast ─────────────────────────────────────────────────────────────────────
let _addToast = null;
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  _addToast = (msg, type='ok') => {
    const id = Date.now();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  };
  return (
    <>
      {children}
      <div className="ui-toasts">
        {toasts.map(t => (
          <div key={t.id} className={`ui-toast ui-toast-${t.type}`}>{t.msg}</div>
        ))}
      </div>
    </>
  );
}
const toast = (msg, type) => _addToast?.(msg, type);

// ── Modal ─────────────────────────────────────────────────────────────────────
function Modal({ title, sub, wide, onClose, footer, children }) {
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="ui-modal-backdrop" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className={`ui-modal${wide?' ui-modal--wide':''}`}>
        <div className="ui-modal-head">
          <div>
            <div className="ui-modal-title">{title}</div>
            {sub && <div className="ui-modal-sub">{sub}</div>}
          </div>
          <button className="ui-close" onClick={onClose}>✕</button>
        </div>
        <div className="ui-modal-body">{children}</div>
        {footer && <div className="ui-modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

// ── Field ─────────────────────────────────────────────────────────────────────
function Field({ label, hint, children }) {
  return (
    <div className="ui-field">
      {label && <label className="ui-label">{label}</label>}
      {children}
      {hint && <div className="ui-hint">{hint}</div>}
    </div>
  );
}
function Select({ value, onChange, options, placeholder }) {
  return (
    <div className="ui-select-wrap">
      <select className="ui-input" value={value} onChange={e=>onChange(e.target.value)}>
        {placeholder && <option value="">{placeholder}</option>}
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      <span className="ui-select-arrow">▼</span>
    </div>
  );
}

// ── Sessions Log ──────────────────────────────────────────────────────────────
function Sessions({ chapters, sports, coaches }) {
  const [rows, setRows] = useState([]);
  const [filters, setFilters] = useState({ chapter_id:'', sport_id:'', coach_id:'', date_from:'', date_to:'' });
  const [detail, setDetail] = useState(null);
  const [participants, setParticipants] = useState([]);
  const [editing, setEditing] = useState(null);
  const [ef, setEf] = useState({});
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    const p = new URLSearchParams(Object.fromEntries(Object.entries(filters).filter(([,v])=>v)));
    api(`/api/sessions?${p}`).then(setRows);
  }, [filters]);

  useEffect(() => { load(); }, [load]);

  const del = async id => {
    if (!confirm('Delete this session?')) return;
    await api(`/api/sessions/${id}`, { method:'DELETE' });
    toast('Session deleted'); load();
  };

  const openEdit = r => {
    setEditing(r);
    setEf({ session_date:r.session_date, chapter_id:String(r.chapter_id||''), sport_id:String(r.sport_id||''), duration_minutes:r.duration_minutes||'', participants:r.participants||'', location:r.location||'', notes:r.notes||'' });
  };

  const saveEdit = async () => {
    setSaving(true);
    const r = await api(`/api/sessions/${editing.id}`, { method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({...ef, coach_id:editing.coach_id}) });
    setSaving(false);
    if (r.ok) { toast('Session updated!'); setEditing(null); load(); }
    else toast(r.error||'Error','err');
  };

  const openDetail = async row => {
    setDetail(row);
    const p = await api(`/api/participants?session_id=${row.id}`);
    setParticipants(p);
  };

  const exportCSV = () => {
    const cols = ['id','session_date','coach','chapter','sport','duration_minutes','participants','location','notes','submitted_by'];
    const csv = [cols.join(','), ...rows.map(r => cols.map(c => JSON.stringify(r[c]??'')).join(','))].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'sessions.csv'; a.click();
  };

  const sf = (k,v) => setFilters(f => ({...f,[k]:v}));

  return (
    <div className="view">
      <div className="ts-pagehead">
        <div>
          <div className="ts-eyebrow">📋 Log</div>
          <h1 className="ts-h1">Sessions</h1>
          <p className="ts-lede">{rows.length} session{rows.length!==1?'s':''} found</p>
        </div>
        <div className="ts-pagehead-actions">
          <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={exportCSV}>⬇ Export CSV</button>
        </div>
      </div>
      <div className="ts-filterbar">
        <Select value={filters.chapter_id} onChange={v=>sf('chapter_id',v)} placeholder="All Chapters"
          options={chapters.map(c=>({value:String(c.id),label:c.name}))}/>
        <Select value={filters.sport_id} onChange={v=>sf('sport_id',v)} placeholder="All Sports"
          options={sports.map(s=>({value:String(s.id),label:s.name}))}/>
        <Select value={filters.coach_id} onChange={v=>sf('coach_id',v)} placeholder="All Coaches"
          options={coaches.map(c=>({value:String(c.id),label:c.name}))}/>
        <input className="ui-input" style={{width:'140px'}} type="date" value={filters.date_from} onChange={e=>sf('date_from',e.target.value)}/>
        <input className="ui-input" style={{width:'140px'}} type="date" value={filters.date_to} onChange={e=>sf('date_to',e.target.value)}/>
        <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>setFilters({chapter_id:'',sport_id:'',coach_id:'',date_from:'',date_to:''})}>Clear</button>
      </div>
      <div className="ts-card ts-tablecard">
        {rows.length === 0
          ? <div className="ts-table-empty">No sessions match these filters.</div>
          : <table className="ts-table">
              <thead><tr>
                <th>Date</th><th>Coach</th><th>Chapter</th><th>Sport</th>
                <th>Duration</th><th>Participants</th><th>Location</th><th>Notes</th><th></th>
              </tr></thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.id}>
                    <td><strong>{fmt(r.session_date)}</strong></td>
                    <td>{r.coach||'—'}</td>
                    <td>{r.chapter||'—'}</td>
                    <td>{r.sport ? <span className="ui-tag ui-tag--green">{r.sport}</span> : '—'}</td>
                    <td>{r.duration_minutes ? `${r.duration_minutes}m` : '—'}</td>
                    <td style={{textAlign:'right'}}><strong style={{fontFamily:'var(--display)'}}>{r.participants||'—'}</strong></td>
                    <td style={{color:'var(--muted)',fontSize:'12.5px'}}>{r.location||'—'}</td>
                    <td style={{maxWidth:'160px',fontSize:'12.5px',color:'var(--muted)'}}>{r.notes||''}</td>
                    <td>
                      <div style={{display:'flex',gap:'6px'}}>
                        <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>openDetail(r)}>View</button>
                        <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>openEdit(r)}>Edit</button>
                        <button className="ui-btn ui-btn--danger ui-btn--sm" onClick={()=>del(r.id)}>✕</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
        }
      </div>

      {editing && (
        <Modal title={`Edit Session — ${fmt(editing.session_date)}`} sub={editing.coach||''}
          onClose={()=>setEditing(null)}
          footer={<>
            <button className="ui-btn ui-btn--ghost" onClick={()=>setEditing(null)}>Cancel</button>
            <button className="ui-btn ui-btn--primary" onClick={saveEdit} disabled={saving}>{saving?'Saving…':'Save'}</button>

        >
          <div className="ts-form-grid">
            <Field label="Date"><input className="ui-input" type="date" value={ef.session_date} onChange={e=>setEf(x=>({...x,session_date:e.target.value}))}/></Field>
            <Field label="Participants"><input className="ui-input" type="number" min="0" value={ef.participants} onChange={e=>setEf(x=>({...x,participants:e.target.value}))}/></Field>
            <Field label="Chapter"><Select value={ef.chapter_id} onChange={v=>setEf(x=>({...x,chapter_id:v}))} placeholder="— None —" options={chapters.map(c=>({value:String(c.id),label:c.name}))}/></Field>
            <Field label="Sport"><Select value={ef.sport_id} onChange={v=>setEf(x=>({...x,sport_id:v}))} placeholder="— None —" options={sports.map(s=>({value:String(s.id),label:s.name}))}/></Field>
            <Field label="Location"><input className="ui-input" value={ef.location} onChange={e=>setEf(x=>({...x,location:e.target.value}))}/></Field>
            <Field label="Duration (min)"><input className="ui-input" type="number" min="0" value={ef.duration_minutes} onChange={e=>setEf(x=>({...x,duration_minutes:e.target.value}))}/></Field>
            <div className="ts-form-full"><Field label="Notes"><textarea className="ui-input" rows={3} value={ef.notes} onChange={e=>setEf(x=>({...x,notes:e.target.value}))} style={{resize:'vertical'}}/></Field></div>
          </div>
        </Modal>
      )}

      {detail && (
        <Modal title={`Session — ${fmt(detail.session_date)}`} sub={`${detail.coach||'Unknown coach'} · ${detail.chapter||''} · ${detail.sport||''}`}
          wide onClose={()=>setDetail(null)}>
          <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',fontSize:'13.5px'}}>
              <div><span style={{color:'var(--muted)',fontSize:'11.5px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Location</span><br/>{detail.location||'—'}</div>
              <div><span style={{color:'var(--muted)',fontSize:'11.5px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Duration</span><br/>{detail.duration_minutes ? `${detail.duration_minutes} min` : '—'}</div>
              <div><span style={{color:'var(--muted)',fontSize:'11.5px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Participants</span><br/><strong style={{fontFamily:'var(--display)',fontSize:'20px'}}>{detail.participants||'—'}</strong></div>
              <div><span style={{color:'var(--muted)',fontSize:'11.5px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em'}}>Submitted by</span><br/>{detail.submitted_by||'—'}</div>
            </div>
            {detail.notes && <div style={{background:'var(--surface-2)',borderRadius:'10px',padding:'12px 14px',fontSize:'13.5px',lineHeight:1.6}}>{detail.notes}</div>}
            <div>
              <div style={{fontSize:'11.5px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:'10px'}}>
                Participant Contacts ({participants.length})
              </div>
              {participants.length === 0
                ? <div style={{color:'var(--muted)',fontSize:'13px'}}>No participant contact info submitted for this session.</div>
                : <table className="ts-ptable">
                    <thead><tr><th>Child</th><th>Parent/Guardian</th><th>Contact</th></tr></thead>
                    <tbody>
                      {participants.map(p => (
                        <tr key={p.id}><td>{p.name}</td><td>{p.parent_name||'—'}</td><td>{p.parent_contact||'—'}</td></tr>
                      ))}
                    </tbody>
                  </table>
              }
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Add Session ───────────────────────────────────────────────────────────────
function AddSession({ chapters, sports, coaches, onSaved }) {
  const [f, setF] = useState({ coach_id:'', chapter_id:'', sport_id:'', session_date:'', duration_minutes:'', participants:'', location:'', notes:'', submitted_by:'' });
  const sf = (k,v) => setF(x=>({...x,[k]:v}));
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    if (!f.session_date) return toast('Date is required','err');
    setSaving(true);
    const r = await api('/api/sessions', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(f) });
    setSaving(false);
    if (r.id) { toast('Session saved!'); setF({coach_id:'',chapter_id:'',sport_id:'',session_date:'',duration_minutes:'',participants:'',location:'',notes:'',submitted_by:''}); onSaved?.(); }
    else toast(r.error||'Error','err');
  };

  const coach = coaches.find(c=>String(c.id)===f.coach_id);

  return (
    <div className="view">
      <div>
        <div className="ts-eyebrow">➕ Log</div>
        <h1 className="ts-h1">Add Session</h1>
        <p className="ts-lede">Log a coaching session on behalf of a coach, or coaches can use the submit form.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:'16px',alignItems:'start'}}>
        <div className="ts-card" style={{padding:'22px 24px'}}>
          <div className="ts-form-grid">
            <Field label="Session Date *">
              <input className="ui-input" type="date" value={f.session_date} onChange={e=>sf('session_date',e.target.value)}/>
            </Field>
            <Field label="Coach">
              <Select value={f.coach_id} onChange={v=>sf('coach_id',v)} placeholder="— Select Coach —"
                options={coaches.map(c=>({value:String(c.id),label:c.name}))}/>
            </Field>
            <Field label="Chapter">
              <Select value={f.chapter_id} onChange={v=>sf('chapter_id',v)} placeholder="— Select Chapter —"
                options={chapters.map(c=>({value:String(c.id),label:c.name}))}/>
            </Field>
            <Field label="Sport">
              <Select value={f.sport_id} onChange={v=>sf('sport_id',v)} placeholder="— Select Sport —"
                options={sports.map(s=>({value:String(s.id),label:s.name}))}/>
            </Field>
            <Field label="Duration (minutes)">
              <input className="ui-input" type="number" min="0" value={f.duration_minutes} onChange={e=>sf('duration_minutes',e.target.value)} placeholder="60"/>
            </Field>
            <Field label="Number of Participants">
              <input className="ui-input" type="number" min="0" value={f.participants} onChange={e=>sf('participants',e.target.value)}/>
            </Field>
            <Field label="Location" hint="Park name, address, gym, etc.">
              <input className="ui-input" type="text" value={f.location} onChange={e=>sf('location',e.target.value)} className="ts-form-full ui-input"/>
            </Field>
            <Field label="Notes">
              <textarea className="ui-input ts-form-full" rows={3} value={f.notes} onChange={e=>sf('notes',e.target.value)} style={{resize:'vertical'}}/>
            </Field>
            <Field label="Submitted By">
              <input className="ui-input" type="text" value={f.submitted_by} onChange={e=>sf('submitted_by',e.target.value)}/>
            </Field>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid var(--border)'}}>
            <button className="ui-btn ui-btn--primary" onClick={submit} disabled={saving}>
              {saving ? 'Saving…' : 'Save Session'}
            </button>
          </div>
        </div>

        <div className="ts-card" style={{padding:'20px',background:'linear-gradient(160deg,var(--accent-soft),var(--surface))'}}>
          <div style={{fontSize:'11.5px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:'12px'}}>Preview</div>
          {coach && <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px'}}>{av(coach.name,38)}<strong style={{fontFamily:'var(--display)'}}>{coach.name}</strong></div>}
          <div style={{fontFamily:'var(--display)',fontWeight:800,fontSize:'52px',lineHeight:1,letterSpacing:'-2px',color:'var(--accent)',marginBottom:'4px'}}>
            {f.participants||'—'}
          </div>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'16px'}}>participants</div>
          {f.session_date && <div style={{fontSize:'13px',marginBottom:'6px'}}>📅 {fmt(f.session_date)}</div>}
          {f.location && <div style={{fontSize:'13px',marginBottom:'6px'}}>📍 {f.location}</div>}
          {f.duration_minutes && <div style={{fontSize:'13px'}}>⏱ {f.duration_minutes} minutes</div>}
        </div>
      </div>
    </div>
  );
}

// ── Manage Coaches ────────────────────────────────────────────────────────────
function ManageCoaches({ chapters, sports, onRefresh }) {
  const [coaches, setCoaches] = useState([]);
  const [modal, setModal] = useState(null); // null | 'add' | coach obj
  const [f, setF] = useState({ name:'', email:'', phone:'', chapter_id:'', sport_id:'', bio:'', active:'1', access_code:'' });
  const [saving, setSaving] = useState(false);
  const sf = (k,v) => setF(x=>({...x,[k]:v}));

  const load = () => api('/api/coaches').then(setCoaches);
  useEffect(() => { load(); }, []);

  const openAdd = () => { setF({ name:'',email:'',phone:'',chapter_id:'',sport_id:'',bio:'',active:'1',access_code:'' }); setModal('add'); };
  const openEdit = c => { setF({ name:c.name,email:c.email||'',phone:c.phone||'',chapter_id:String(c.chapter_id||''),sport_id:String(c.sport_id||''),bio:c.bio||'',active:String(c.active),access_code:c.access_code||'' }); setModal(c); };

  const save = async () => {
    if (!f.name) return toast('Name is required','err');
    setSaving(true);
    const isEdit = typeof modal === 'object' && modal !== null && modal !== 'add';
    const r = isEdit
      ? await api(`/api/coaches/${modal.id}`, { method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(f) })
      : await api('/api/coaches', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(f) });
    setSaving(false);
    if (r.ok || r.id) { toast('Coach saved!'); setModal(null); load(); onRefresh?.(); }
    else toast(r.error||'Error','err');
  };

  const del = async id => {
    if (!confirm('Delete this coach?')) return;
    await api(`/api/coaches/${id}`, { method:'DELETE' });
    toast('Coach deleted'); load(); onRefresh?.();
  };

  return (
    <div className="view">
      <div className="ts-pagehead">
        <div>
          <div className="ts-eyebrow">🛠 Coaches</div>
          <h1 className="ts-h1">Manage Coaches</h1>
          <p className="ts-lede">Add, edit, or remove coaches from the roster.</p>
        </div>
        <div className="ts-pagehead-actions">
          <button className="ui-btn ui-btn--primary" onClick={openAdd}>+ Add Coach</button>
        </div>
      </div>
      <div className="ts-card ts-tablecard">
        <table className="ts-table">
          <thead><tr><th>Coach</th><th>Chapter</th><th>Sport</th><th>Email</th><th>Access Code</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {coaches.map(c => (
              <tr key={c.id}>
                <td><div style={{display:'flex',alignItems:'center',gap:'10px'}}>{av(c.name,32)}<strong>{c.name}</strong></div></td>
                <td>{c.chapter||'—'}</td>
                <td>{c.sport ? <span className="ui-tag ui-tag--blue">{c.sport}</span> : '—'}</td>
                <td style={{fontSize:'12.5px',color:'var(--muted)'}}>{c.email||'—'}</td>
                <td><code style={{fontSize:'12px',background:'var(--surface-2)',padding:'2px 8px',borderRadius:'6px'}}>{c.access_code||<span style={{color:'var(--muted)'}}>not set</span>}</code></td>
                <td><span className={`ui-tag ${c.active?'ui-tag--green':'ui-tag--gray'}`}>{c.active?'Active':'Inactive'}</span></td>
                <td>
                  <div style={{display:'flex',gap:'6px'}}>
                    <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>openEdit(c)}>Edit</button>
                    <button className="ui-btn ui-btn--danger ui-btn--sm" onClick={()=>del(c.id)}>✕</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal && (
        <Modal
          title={modal==='add' ? 'Add New Coach' : `Edit ${modal.name}`}
          onClose={()=>setModal(null)}
          footer={<>
            <button className="ui-btn ui-btn--ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="ui-btn ui-btn--primary" onClick={save} disabled={saving}>{saving?'Saving…':'Save'}</button>
          </>}
        >
          <div className="ts-form-grid">
            <div className="ts-form-full"><Field label="Name *"><input className="ui-input" value={f.name} onChange={e=>sf('name',e.target.value)}/></Field></div>
            <Field label="Email"><input className="ui-input" type="email" value={f.email} onChange={e=>sf('email',e.target.value)}/></Field>
            <Field label="Phone"><input className="ui-input" value={f.phone} onChange={e=>sf('phone',e.target.value)}/></Field>
            <Field label="Chapter"><Select value={f.chapter_id} onChange={v=>sf('chapter_id',v)} placeholder="— None —" options={chapters.map(c=>({value:String(c.id),label:c.name}))}/></Field>
            <Field label="Sport"><Select value={f.sport_id} onChange={v=>sf('sport_id',v)} placeholder="— None —" options={sports.map(s=>({value:String(s.id),label:s.name}))}/></Field>
            <div className="ts-form-full"><Field label="Bio / Notes"><textarea className="ui-input" rows={3} value={f.bio} onChange={e=>sf('bio',e.target.value)} style={{resize:'vertical'}}/></Field></div>
            <Field label="Status"><Select value={f.active} onChange={v=>sf('active',v)} options={[{value:'1',label:'Active'},{value:'0',label:'Inactive'}]}/></Field>
            <Field label="Coach Access Code" hint="Share this with the coach so they can log into the coach portal.">
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                <input className="ui-input" value={f.access_code} placeholder="e.g. nyc-harry-42" onChange={e=>sf('access_code',e.target.value)}/>
                <button type="button" className="ui-btn ui-btn--ghost ui-btn--sm" style={{whiteSpace:'nowrap'}}
                  onClick={()=>sf('access_code', Math.random().toString(36).slice(2,8).toUpperCase())}>
                  Generate
                </button>
              </div>
            </Field>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Testimonials ──────────────────────────────────────────────────────────────
function Testimonials({ chapters, sports }) {
  const [rows, setRows] = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const load = () => api('/api/testimonials').then(setRows);
  useEffect(() => { load(); }, []);

  const update = async (id, approved, pub) => {
    await api(`/api/testimonials/${id}`, { method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({ approved, public:pub }) });
    toast(pub ? 'Published to impact tracker ✓' : approved ? 'Approved' : 'Marked as pending');
    load();
  };

  const del = async id => {
    if (!confirm('Delete this testimonial?')) return;
    await api(`/api/testimonials/${id}`, { method:'DELETE' });
    toast('Deleted'); load();
  };

  const pending = rows.filter(r=>!r.approved);
  const approved = rows.filter(r=>r.approved && !r.public);
  const published = rows.filter(r=>r.public);

  const TCard = ({ r }) => (
    <div className="ts-tcard">
      <div>
        <div className="ts-tquote">{r.quote}</div>
        <div className="ts-tmeta">
          <span>Coach: <strong>{r.coach_name}</strong></span>
          {r.child_name && <span>Child: {r.child_name}</span>}
          {r.parent_name && <span>Parent: {r.parent_name}</span>}
          {r.parent_contact && <span>Contact: <strong>{r.parent_contact}</strong></span>}
          <span style={{marginTop:'4px'}}>{r.chapter||''} {r.chapter&&r.sport?'·':''} {r.sport||''}</span>
          <span style={{color:'var(--muted)',fontSize:'11.5px'}}>{fmt(r.created_at)}</span>
        </div>
        {r.photo_filename && (
          <img src={`/uploads/${r.photo_filename}`} alt=""
            onClick={()=>setLightbox(r.photo_filename)}
            style={{width:'80px',height:'60px',objectFit:'cover',borderRadius:'8px',marginTop:'10px',cursor:'pointer',border:'1px solid var(--border)'}}/>
        )}
      </div>
      <div className="ts-tactions">
        <span className={`ui-tag ${r.public?'ui-tag--green':r.approved?'ui-tag--blue':'ui-tag--amber'}`}>
          {r.public ? '🌐 Public' : r.approved ? '✓ Approved' : '⏳ Pending'}
        </span>
        {!r.approved && <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>update(r.id,1,0)}>Approve</button>}
        {r.approved && !r.public && <button className="ui-btn ui-btn--primary ui-btn--sm" onClick={()=>update(r.id,1,1)}>Publish ↑</button>}
        {r.public && <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>update(r.id,1,0)}>Unpublish</button>}
        <button className="ui-btn ui-btn--danger ui-btn--sm" onClick={()=>del(r.id)}>Delete</button>
      </div>
    </div>
  );

  return (
    <div className="view">
      <div>
        <div className="ts-eyebrow">💬 Testimonials</div>
        <h1 className="ts-h1">Testimonials</h1>
        <p className="ts-lede">Review and publish to the impact tracker. Coaches and parents submit via the coach portal.</p>
      </div>

      {pending.length > 0 && (
        <div>
          <h3 style={{fontFamily:'var(--display)',fontSize:'15px',marginBottom:'12px',color:'var(--danger)'}}>⏳ Pending Review ({pending.length})</h3>
          <div className="ts-testimonials">{pending.map(r=><TCard key={r.id} r={r}/>)}</div>
        </div>
      )}
      {approved.length > 0 && (
        <div>
          <h3 style={{fontFamily:'var(--display)',fontSize:'15px',marginBottom:'12px'}}>✓ Approved — Not Yet Public ({approved.length})</h3>
          <div className="ts-testimonials">{approved.map(r=><TCard key={r.id} r={r}/>)}</div>
        </div>
      )}
      {published.length > 0 && (
        <div>
          <h3 style={{fontFamily:'var(--display)',fontSize:'15px',marginBottom:'12px',color:'var(--accent)'}}>🌐 Published on Impact Tracker ({published.length})</h3>
          <div className="ts-testimonials">{published.map(r=><TCard key={r.id} r={r}/>)}</div>
        </div>
      )}
      {rows.length === 0 && (
        <div className="ts-card" style={{padding:'40px',textAlign:'center',color:'var(--muted)'}}>
          No testimonials yet. Coaches can submit via the coach portal.
        </div>
      )}

      {lightbox && (
        <div className="lightbox-wrap" onClick={()=>setLightbox(null)}>
          <button className="lightbox-close" onClick={()=>setLightbox(null)}>✕</button>
          <img src={`/uploads/${lightbox}`} alt=""/>
        </div>
      )}
    </div>
  );
}

// ── Photo Gallery ─────────────────────────────────────────────────────────────
function Gallery({ chapters, sports }) {
  const [photos, setPhotos] = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const [modal, setModal] = useState(false);
  const [f, setF] = useState({ caption:'', chapter_id:'', sport_id:'' });
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef();

  const load = () => api('/api/photos').then(setPhotos);
  useEffect(() => { load(); }, []);

  const pickFile = e => {
    const f = e.target.files[0];
    if (!f) return;
    setFile(f);
    setPreview(URL.createObjectURL(f));
  };

  const upload = async () => {
    if (!file) return toast('Select a photo first','err');
    setUploading(true);
    const fd = new FormData();
    fd.append('photo', file);
    fd.append('caption', f.caption);
    fd.append('chapter_id', f.chapter_id);
    fd.append('sport_id', f.sport_id);
    const r = await fetch('/api/photos', { method:'POST', headers:{'x-admin-token':TOKEN()}, body:fd }).then(x=>x.json());
    setUploading(false);
    if (r.id) { toast('Photo uploaded!'); setModal(false); setFile(null); setPreview(null); setF({caption:'',chapter_id:'',sport_id:''}); load(); }
    else toast(r.error||'Upload failed','err');
  };

  const del = async id => {
    if (!confirm('Delete this photo?')) return;
    await api(`/api/photos/${id}`, { method:'DELETE' });
    toast('Deleted'); load();
  };

  const approve = async (id, approved) => {
    await api(`/api/photos/${id}`, { method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({ approved }) });
    toast(approved ? 'Photo approved' : 'Photo hidden'); load();
  };

  const pending = photos.filter(p=>!p.approved);
  const approved = photos.filter(p=>p.approved);

  return (
    <div className="view">
      <div className="ts-pagehead">
        <div>
          <div className="ts-eyebrow">🖼 Gallery</div>
          <h1 className="ts-h1">Photo Gallery</h1>
          <p className="ts-lede">{photos.length} photos total · {pending.length} pending approval</p>
        </div>
        <button className="ui-btn ui-btn--primary" onClick={()=>setModal(true)}>+ Upload Photo</button>
      </div>

      {pending.length > 0 && (
        <div>
          <h3 style={{fontFamily:'var(--display)',fontSize:'15px',marginBottom:'12px',color:'var(--danger)'}}>⏳ Pending Approval ({pending.length})</h3>
          <div className="ts-gallery">
            {pending.map(p => (
              <div key={p.id} className="ts-gphoto">
                <img src={`/uploads/${p.filename}`} alt={p.caption||''} onClick={()=>setLightbox(p.filename)}/>
                <div className="ts-gphoto-meta">
                  <div className="ts-gphoto-cap">{p.caption||'No caption'}</div>
                  <div className="ts-gphoto-sub">{p.chapter||''} {p.sport||''}</div>
                  <div className="ts-gphoto-actions">
                    <button className="ui-btn ui-btn--primary ui-btn--sm" onClick={()=>approve(p.id,1)}>Approve</button>
                    <button className="ui-btn ui-btn--danger ui-btn--sm" onClick={()=>del(p.id)}>Delete</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        {approved.length > 0 && pending.length > 0 && <h3 style={{fontFamily:'var(--display)',fontSize:'15px',marginBottom:'12px'}}>Approved Photos</h3>}
        <div className="ts-gallery">
          {approved.map(p => (
            <div key={p.id} className="ts-gphoto">
              <img src={`/uploads/${p.filename}`} alt={p.caption||''} onClick={()=>setLightbox(p.filename)}/>
              <div className="ts-gphoto-meta">
                <div className="ts-gphoto-cap">{p.caption||'No caption'}</div>
                <div className="ts-gphoto-sub">{p.chapter||''} {p.sport||''}</div>
                <div className="ts-gphoto-actions">
                  <button className="ui-btn ui-btn--ghost ui-btn--sm" onClick={()=>approve(p.id,0)}>Hide</button>
                  <button className="ui-btn ui-btn--danger ui-btn--sm" onClick={()=>del(p.id)}>Delete</button>
                </div>
              </div>
            </div>
          ))}
        </div>
        {photos.length === 0 && <div className="ts-card" style={{padding:'40px',textAlign:'center',color:'var(--muted)'}}>No photos yet.</div>}
      </div>

      {lightbox && (
        <div className="lightbox-wrap" onClick={()=>setLightbox(null)}>
          <button className="lightbox-close">✕</button>
          <img src={`/uploads/${lightbox}`} alt=""/>
        </div>
      )}

      {modal && (
        <Modal title="Upload Photo" onClose={()=>{setModal(false);setPreview(null);setFile(null)}}
          footer={<>
            <button className="ui-btn ui-btn--ghost" onClick={()=>setModal(false)}>Cancel</button>
            <button className="ui-btn ui-btn--primary" onClick={upload} disabled={uploading}>{uploading?'Uploading…':'Upload'}</button>
          </>}
        >
          <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
            <div className="ts-uploaddrop" onClick={()=>fileRef.current?.click()}>
              {preview ? <img src={preview} alt=""/> : (
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',color:'var(--muted)'}}>
                  <span style={{fontSize:'2rem'}}>📷</span>
                  <strong style={{fontFamily:'var(--display)',fontSize:'15px',color:'var(--text)'}}>Click to select photo</strong>
                  <span style={{fontSize:'12px'}}>JPEG, PNG, GIF, WebP · max 10 MB</span>
                </div>
              )}
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={pickFile}/>
            <Field label="Caption"><input className="ui-input" value={f.caption} onChange={e=>setF(x=>({...x,caption:e.target.value}))}/></Field>
            <Field label="Chapter"><Select value={f.chapter_id} onChange={v=>setF(x=>({...x,chapter_id:v}))} placeholder="— All Chapters —" options={chapters.map(c=>({value:String(c.id),label:c.name}))}/></Field>
            <Field label="Sport"><Select value={f.sport_id} onChange={v=>setF(x=>({...x,sport_id:v}))} placeholder="— All Sports —" options={sports.map(s=>({value:String(s.id),label:s.name}))}/></Field>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Settings ──────────────────────────────────────────────────────────────────
function Settings({ chapters, sports, onRefresh }) {
  const [settings, setSettings] = useState({});
  const [newChapter, setNewChapter] = useState('');
  const [newSport, setNewSport] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => { api('/api/settings').then(setSettings); }, []);

  const saveSettings = async () => {
    setSaving(true);
    const r = await api('/api/settings', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(settings) });
    setSaving(false);
    if (r.ok) toast('Settings saved!'); else toast('Error','err');
  };

  const addChapter = async () => {
    if (!newChapter.trim()) return;
    await fetch('/api/chapters', { method:'POST', headers:{'content-type':'application/json','x-admin-token':TOKEN()}, body:JSON.stringify({name:newChapter.trim()}) });
    setNewChapter(''); toast('Chapter added!'); onRefresh?.();
  };

  const addSport = async () => {
    if (!newSport.trim()) return;
    await fetch('/api/sports', { method:'POST', headers:{'content-type':'application/json','x-admin-token':TOKEN()}, body:JSON.stringify({name:newSport.trim()}) });
    setNewSport(''); toast('Sport added!'); onRefresh?.();
  };

  return (
    <div className="view">
      <div>
        <div className="ts-eyebrow">⚙️ Config</div>
        <h1 className="ts-h1">Settings</h1>
      </div>
      <div className="ts-settings-grid">
        <div className="ts-setcard">
          <h3>Organization</h3>
          <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
            <Field label="Organization Name"><input className="ui-input" value={settings.org_name||''} onChange={e=>setSettings(s=>({...s,org_name:e.target.value}))}/></Field>
            <Field label="Contact Email"><input className="ui-input" type="email" value={settings.contact_email||''} onChange={e=>setSettings(s=>({...s,contact_email:e.target.value}))}/></Field>
            <button className="ui-btn ui-btn--primary" style={{alignSelf:'flex-start'}} onClick={saveSettings} disabled={saving}>{saving?'Saving…':'Save'}</button>
          </div>
        </div>
        <div className="ts-setcard">
          <h3>Chapters</h3>
          <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'14px'}}>
            {chapters.map(c=><div key={c.id} style={{fontSize:'13.5px',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>{c.name}</div>)}
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <input className="ui-input" placeholder="New chapter name" value={newChapter} onChange={e=>setNewChapter(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addChapter()}/>
            <button className="ui-btn ui-btn--primary" onClick={addChapter}>Add</button>
          </div>
        </div>
        <div className="ts-setcard">
          <h3>Sports</h3>
          <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'14px'}}>
            {sports.map(s=><div key={s.id} style={{fontSize:'13.5px',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>{s.name}</div>)}
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <input className="ui-input" placeholder="New sport name" value={newSport} onChange={e=>setNewSport(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSport()}/>
            <button className="ui-btn ui-btn--primary" onClick={addSport}>Add</button>
          </div>
        </div>
        <div className="ts-setcard">
          <h3>Coach Portal</h3>
          <p style={{fontSize:'13.5px',color:'var(--muted)',lineHeight:1.6,marginBottom:'12px'}}>Share this link with coaches to log sessions, submit testimonials, and upload photos without admin access.</p>
          <div style={{background:'var(--surface-2)',borderRadius:'10px',padding:'11px 14px',fontFamily:'monospace',fontSize:'13px',wordBreak:'break-all'}}>
            {window.location.origin}/coach.html
          </div>
          <button className="ui-btn ui-btn--ghost ui-btn--sm" style={{marginTop:'10px'}} onClick={()=>{navigator.clipboard.writeText(window.location.origin+'/coach.html');toast('Link copied!')}}>Copy Link</button>
        </div>
      </div>
    </div>
  );
}

// ── App shell ─────────────────────────────────────────────────────────────────
function App() {
  const [authed, setAuthed] = useState(!!localStorage.getItem('ts_tok'));
  const [pw, setPw] = useState('');
  const [pwErr, setPwErr] = useState('');
  const [view, setView] = useState('overview');
  const [chapters, setChapters] = useState([]);
  const [sports, setSports] = useState([]);
  const [coaches, setCoaches] = useState([]);
  const [stats, setStats] = useState({});

  const loadRef = useCallback(async () => {
    const [ch, sp, co, st] = await Promise.all([
      api('/api/chapters'), api('/api/sports'), api('/api/coaches'), api('/api/stats')
    ]);
    setChapters(ch); setSports(sp); setCoaches(co); setStats(st);
  }, []);

  useEffect(() => { if (authed) loadRef(); }, [authed, loadRef]);

  const login = async () => {
    const r = await fetch('/api/auth', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({password:pw}) }).then(x=>x.json());
    if (r.ok) { localStorage.setItem('ts_tok', pw); setPwErr(''); setAuthed(true); }
    else setPwErr('Incorrect password');
  };

  const logout = () => { localStorage.removeItem('ts_tok'); setAuthed(false); };

  if (!authed) return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">TS</div>
        <h2>Together Sports</h2>
        <p>Internal Operations Dashboard</p>
        <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}/>
        <button onClick={login}>Sign In</button>
        {pwErr && <div className="login-err">{pwErr}</div>}
      </div>
    </div>
  );

  const pending = (stats.pending_testimonials||0) + (stats.pending_photos||0);
  const views = { overview:Overview, sessions:Sessions, volunteer:VolunteerLogs, roster:Roster, 'add-session':AddSession, coaches:ManageCoaches, testimonials:Testimonials, gallery:Gallery, settings:Settings };
  const ViewComp = views[view] || Overview;

  return (
    <div className="app">
      <aside className="ts-sb">
        <div className="ts-brand">
          <div className="ts-logo">TS</div>
          <div>
            <div className="ts-brandname">Together Sports</div>
            <div className="ts-brandsub">Admin</div>
          </div>
        </div>
        <nav className="ts-nav">
          {NAV.map(n => {
            const badgeCount = n.badge === 'pending_testimonials' ? (stats.pending_testimonials||0)
              : n.badge === 'pending_photos' ? (stats.pending_photos||0) : 0;
            return (
              <button key={n.id} className={`ts-navitem${view===n.id?' active':''}`} onClick={()=>setView(n.id)}>
                <span>{n.icon}</span> {n.label}
                {badgeCount > 0 && <span className="ts-nav-badge">{badgeCount}</span>}
              </button>
            );
          })}
        </nav>
        <div className="ts-sbfoot">
          {stats.total_sessions > 0 && (
            <div className="ts-sbcard">
              <div className="ts-sbcard-k">Sessions</div>
              <div className="ts-sbcard-v">{stats.total_sessions}</div>
              <div className="ts-sbcard-bar"><span style={{width:`${Math.min((stats.total_sessions/100)*100,100)}%`}}/></div>
              <div className="ts-sbcard-sub">{stats.total_participants||0} participants reached</div>
            </div>
          )}
          <button className="ts-logout" onClick={logout}>🚪 Sign Out</button>
        </div>
      </aside>
      <main className="ts-main">
        <div className="ts-top">
          <div className="ts-top-title">{NAV.find(n=>n.id===view)?.label||'Dashboard'}</div>
          <div className="ts-topright">
            <a href="/coach.html" target="_blank" className="ui-btn ui-btn--ghost ui-btn--sm">Coach Portal ↗</a>
            <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
              {av('Admin',34)}
              <div><div className="ts-username">Admin</div><div className="ts-userrole">Full Access</div></div>
            </div>
          </div>
        </div>
        <div className="ts-content">
          <div className="ts-content-inner">
            <ViewComp chapters={chapters} sports={sports} coaches={coaches} onSaved={loadRef} onRefresh={loadRef}/>
          </div>
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ToastProvider><App/></ToastProvider>);
</script>
</body>
</html>
