<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Together Sports · Admin</title>
<link rel="icon" href="assets/ts-mark.png" />
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="outreach.css" />
<style>
  :root {
    --display: "League Spartan", system-ui, sans-serif;
    --body: "Montserrat", system-ui, sans-serif;
    --bg: #F6F5EC; --surface: #FFFFFF; --surface-2: #EFEDDF;
    --border: #E7E5D4; --text: #20233C; --muted: #7B7E6C;
    --ink: #0A0D28;
    --accent: #285400; --accent-deep: #1B3A00; --accent-soft: #E9F1D9; --accent-ink: #FFFFFF;
    --peach: #F6A15C; --peach-soft: #FCEBDA;
    --lime: #87CB4A; --lime-soft: #EBF6DF;
    --danger: #B3261E; --danger-soft: #F7E4E2;
    --sb-text: #EDEEF6; --sb-muted: #9096BB; --sb-line: rgba(255,255,255,.09); --sb-fill: rgba(255,255,255,.07);
    --radius: 20px; --radius-sm: 13px;
    --shadow-sm: 0 1px 2px rgba(10,13,40,.04);
    --shadow: 0 10px 30px rgba(10,13,40,.08);
    --shadow-lg: 0 28px 70px rgba(10,13,40,.2);
    --hero: linear-gradient(150deg, #282C50 0%, #0A0D28 92%);
    --sb-bg: linear-gradient(180deg, #12163C 0%, #0A0D28 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--body); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-deep); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--peach); outline-offset: 2px; }
  .ts-ic { flex: 0 0 auto; }

  /* ── App layout ───────────────────────────────────── */
  .app { height: 100vh; display: grid; grid-template-columns: 264px 1fr; overflow: hidden; }
  .ts-main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .ts-content { flex: 1; overflow-y: auto; background: var(--bg); }
  .ts-content-inner { padding: 30px 40px 72px; max-width: 1360px; margin: 0 auto; animation: viewfade .3s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes viewfade { from { transform: translateY(8px); opacity: .01; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ts-content-inner { animation: none; } }
  .view { display: flex; flex-direction: column; gap: 22px; }

  /* ── Sidebar (ink) ────────────────────────────────── */
  .ts-sb { display: flex; flex-direction: column; background: var(--sb-bg); color: var(--sb-text); padding: 24px 16px 18px; }
  .ts-brand { display: flex; align-items: center; gap: 12px; padding: 2px 6px 22px; }
  .ts-logo-img { width: 42px; height: 42px; object-fit: contain; flex: 0 0 auto; background: #fff; border-radius: 12px; padding: 5px; }
  .ts-logo-img--lg { width: 88px; height: 88px; object-fit: contain; flex: 0 0 auto; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 12px; }
  .ts-brandname { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -.2px; line-height: 1.1; white-space: nowrap; color: #fff; }
  .ts-brandsub { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-muted); font-weight: 600; margin-top: 3px; }
  .ts-quickadd { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--peach); color: var(--ink); border: 0; border-radius: 13px; padding: 13px 15px; font-family: var(--body); font-weight: 700; font-size: 13.5px; cursor: pointer; box-shadow: 0 8px 22px rgba(246,161,92,.22); transition: transform .12s, box-shadow .12s, background .14s; margin-bottom: 8px; }
  .ts-quickadd:hover { transform: translateY(-1px); background: #F8AC6F; }
  .ts-quickadd.is-active { background: #F8AC6F; }
  .ts-quickadd .ui-kbd { margin-left: auto; background: rgba(10,13,40,.12); border-color: transparent; color: var(--ink); }
  .ts-navlabel { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-muted); font-weight: 700; padding: 14px 8px 7px; }
  .ts-nav { display: flex; flex-direction: column; gap: 3px; }
  .ts-navitem { position: relative; display: flex; align-items: center; gap: 13px; padding: 11px 13px; border-radius: 12px; color: var(--sb-muted); background: none; border: 0; cursor: pointer; font-family: var(--body); font-weight: 500; font-size: 13.5px; text-align: left; transition: background .14s, color .14s; }
  .ts-navitem:hover { background: var(--sb-fill); color: #fff; }
  .ts-navitem.is-active { background: var(--sb-fill); color: #fff; font-weight: 600; }
  .ts-navitem.is-active::before { content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%); width: 4px; height: 20px; border-radius: 0 4px 4px 0; background: var(--peach); }
  .ts-navitem.is-active .ts-ic { color: var(--peach); }
  .ts-sbfoot { margin-top: auto; padding-top: 18px; }
  .ts-sbcard { border-radius: 16px; padding: 16px; background: var(--sb-fill); border: 1px solid var(--sb-line); }
  .ts-sbcard-k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--sb-muted); }
  .ts-sbcard-v { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 7px 0 12px; letter-spacing: -.3px; color: #fff; }
  .ts-sbcard-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  .ts-sbcard-bar span { display: block; height: 100%; border-radius: 99px; background: var(--lime); }
  .ts-sbcard-sub { font-size: 11.5px; margin-top: 9px; color: var(--sb-muted); font-weight: 500; }

  /* ── Topbar ───────────────────────────────────────── */
  .ts-top { display: flex; align-items: center; gap: 14px; padding: 15px 40px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--surface) 72%, var(--bg)); flex: 0 0 auto; backdrop-filter: blur(8px); z-index: 5; }
  .ts-searchbtn { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 10px 10px 10px 17px; color: var(--muted); font-family: var(--body); font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color .14s, box-shadow .14s; }
  .ts-searchbtn:hover { border-color: color-mix(in oklab, var(--accent) 32%, var(--border)); box-shadow: var(--shadow-sm); }
  .ts-searchbtn .ui-kbd { margin-left: auto; }
  .ts-topright { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .ts-topdiv { width: 1px; height: 26px; background: var(--border); }
  .ts-chapsel, .ts-bellwrap { position: relative; }
  .ts-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 9px 14px; font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
  .ts-chip .ts-ic { color: var(--accent); }
  .ts-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 224px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 7px; z-index: 20; max-height: 340px; overflow-y: auto; }
  .ts-menu--feed { width: 324px; padding: 10px; }
  .ts-menu-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 11px; border-radius: 10px; font-family: var(--body); font-size: 13px; color: var(--text); cursor: pointer; }
  .ts-menu-item:hover { background: var(--surface-2); }
  .ts-menu-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .ts-menu-flag { font-size: 14px; }
  .ts-feedhead { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); padding: 4px 8px 8px; }
  .ts-feedrow { display: flex; gap: 11px; align-items: flex-start; padding: 10px 8px; border-radius: 12px; }
  .ts-feedrow:hover { background: var(--surface-2); }
  .ts-feed-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: 0 0 auto; }
  .ts-feed-text { font-size: 12.5px; line-height: 1.45; }
  .ts-feed-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ts-iconbtn { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; position: relative; }
  .ts-iconbtn::after { content: ""; position: absolute; top: 10px; right: 11px; width: 6px; height: 6px; border-radius: 99px; background: var(--peach); border: 2px solid var(--surface); }
  .ts-avatar { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; background: var(--ink); color: var(--peach); font-family: var(--display); font-weight: 700; font-size: 13px; flex: 0 0 auto; }
  .ts-userchip { display: flex; align-items: center; gap: 10px; }
  .ts-usermeta { display: flex; flex-direction: column; line-height: 1.25; }
  .ts-username { font-size: 13px; font-weight: 600; }
  .ts-userrole { font-size: 11px; color: var(--muted); }

  /* ── kbd ──────────────────────────────────────────── */
  .ui-kbd { font-family: var(--body); font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 3px 7px; line-height: 1; white-space: nowrap; }

  /* ── Page header ──────────────────────────────────── */
  .ts-pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .ts-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .ts-eyebrow .ts-ic { color: var(--accent); }
  .ts-h1 { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: -.8px; margin: 11px 0 7px; line-height: 1.02; color: var(--ink); }
  .ts-lede { color: var(--muted); font-size: 14px; max-width: 60ch; margin: 0; line-height: 1.5; }
  .ts-pagehead-actions { display: flex; gap: 10px; flex: 0 0 auto; }

  /* ── Buttons ──────────────────────────────────────── */
  .ui-btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--body); font-weight: 600; font-size: 13.5px; padding: 12px 20px; border-radius: 99px; border: 1px solid transparent; white-space: nowrap; transition: transform .12s, box-shadow .12s, background .14s, border-color .14s; }
  .ui-btn:hover { transform: translateY(-1px); }
  .ui-btn:active { transform: none; }
  .ui-btn--primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(40,84,0,.22); }
  .ui-btn--primary:hover { background: var(--accent-deep); }
  .ui-btn--ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
  .ui-btn--ghost:hover { border-color: color-mix(in oklab, var(--accent) 36%, var(--border)); }
  .ui-btn--danger { background: var(--danger); color: #fff; }
  .ui-btn--sm { padding: 9px 15px; font-size: 12.5px; }
  .ui-btn--full { width: 100%; justify-content: center; }
  .ui-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .ui-iconbtn { width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: color .14s, border-color .14s, background .14s; }
  .ui-iconbtn:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 36%, var(--border)); }
  .ui-iconbtn.is-danger:hover { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, var(--border)); background: var(--danger-soft); }

  /* ── Stats ────────────────────────────────────────── */
  .ts-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .ts-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); }
  .ts-stat-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .ts-stat-value { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -1.4px; line-height: .95; color: var(--ink); }
  .ts-stat-foot { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .ts-stat-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--lime-soft); padding: 4px 9px; border-radius: 99px; }
  .ts-stat-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .ts-stat--hero { background: var(--hero); border-color: transparent; color: #fff; box-shadow: var(--shadow); }
  .ts-stat--hero .ts-stat-label { color: rgba(255,255,255,.78); }
  .ts-stat--hero .ts-stat-value { color: #fff; }
  .ts-stat--hero .ts-stat-delta { color: var(--ink); background: var(--peach); }
  .ts-stat--hero .ts-stat-sub { color: rgba(255,255,255,.7); }

  /* ── Cards & grid ─────────────────────────────────── */
  .ts-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
  .ts-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .ts-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .ts-sessions, .ts-photos, .ts-chapters, .ts-chart, .ts-attn { padding: 22px 24px; }
  .ts-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
  .ts-card-title { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.3px; margin: 0; white-space: nowrap; }
  .ts-card-sub { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .ts-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; font-size: 12.5px; text-decoration: none; white-space: nowrap; background: none; border: 0; cursor: pointer; transition: gap .14s; }
  .ts-link:hover { gap: 7px; }
  .ts-side { display: flex; flex-direction: column; gap: 18px; }
  .ts-countchip { font-family: var(--display); font-weight: 700; font-size: 12px; background: var(--peach-soft); color: #8A4A12; padding: 4px 10px; border-radius: 99px; }

  /* ── Weekly chart ─────────────────────────────────── */
  .ts-bars { display: flex; gap: 14px; align-items: stretch; height: 178px; margin-top: 12px; }
  .ts-barcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .ts-barwrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .ts-bar { width: 100%; max-width: 56px; border-radius: 9px 9px 5px 5px; background: #DCE7C6; transition: height .35s cubic-bezier(.22,.61,.36,1), background .2s; }
  .ts-bar.is-cur { background: var(--accent); }
  .ts-barcol:hover .ts-bar { background: color-mix(in oklab, var(--accent) 30%, #DCE7C6); }
  .ts-barcol:hover .ts-bar.is-cur { background: var(--accent-deep); }
  .ts-barval { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--text); }
  .ts-barlab { font-size: 10.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  /* ── Needs attention ──────────────────────────────── */
  .ts-attn-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .ts-attn-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--peach-soft); color: #B36A24; flex: 0 0 auto; }
  .ts-attn-main { flex: 1; min-width: 0; }
  .ts-attn-name { font-weight: 600; font-size: 13.5px; }
  .ts-attn-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .ts-allclear { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; color: var(--muted); font-size: 13px; }
  .ts-allclear .ts-ic { color: var(--accent); }

  /* ── Tables ───────────────────────────────────────── */
  .ts-tablecard { padding: 8px 24px 12px; overflow-x: auto; }
  .ts-table--full { min-width: 780px; }
  .ts-table--manage { min-width: 920px; }
  .ts-table { display: flex; flex-direction: column; }
  .ts-tr { display: grid; align-items: center; gap: 10px; padding: 13px 8px; border-top: 1px solid var(--border); border-radius: 12px; transition: background .12s; }
  .ts-table--ov .ts-tr { grid-template-columns: 74px 1.3fr 1fr 1.4fr 56px; }
  .ts-table--ov .ts-tr:not(.ts-tr--head):hover { background: var(--surface-2); }
  .ts-tr--full { grid-template-columns: 88px 1.15fr 1fr 1.35fr 1.15fr 52px 52px 44px; }
  .ts-tr--manage { grid-template-columns: 1.6fr 1fr 1.35fr 76px 130px 100px 96px; }
  .ts-tr--partners { grid-template-columns: 1.9fr .9fr 1fr 1.3fr .8fr .9fr 96px; }
  .ts-tr--head { border-top: 0; padding: 10px 8px; }
  .ts-tr--head:hover { background: none; }
  .ts-tr--click { cursor: pointer; }
  .ts-tr--click:hover { background: var(--surface-2); }
  .ts-tr--head span, .ts-sorthead { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .ts-sorthead { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; cursor: pointer; padding: 0; font-family: var(--body); }
  .ts-sorthead.is-num { justify-content: flex-end; }
  .ts-sorthead:hover { color: var(--accent); }
  .ts-sortcaret { opacity: .4; font-size: 11px; }
  .ts-sortcaret.is-on { opacity: 1; color: var(--accent); }
  .ts-tr span { font-size: 13px; }
  .ts-td-date { font-weight: 600; font-size: 13px; display: flex; flex-direction: column; }
  .ts-td-year { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .ts-pin { display: inline-flex; vertical-align: -2px; margin-right: 5px; color: var(--accent); }
  .ts-td-loc { color: var(--muted); font-size: 12.5px; }
  .ts-coach { display: flex; align-items: center; gap: 9px; font-weight: 500; min-width: 0; }
  .ts-tr--full .ts-coach span, .ts-tr--full .ts-td-loc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-coach-meta { display: flex; flex-direction: column; min-width: 0; }
  .ts-coach-name { font-weight: 600; font-size: 13px; }
  .ts-coach-mail { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-num { text-align: right; justify-self: end; }
  .ts-kids { font-family: var(--display); font-weight: 700; font-size: 16px; }
  .ts-cell-sports { display: flex; gap: 5px; flex-wrap: wrap; }
  .ts-rowactions { display: flex; gap: 6px; justify-content: flex-end; }
  .ts-rowghost { opacity: 0; transition: opacity .14s; }
  .ts-tr:hover .ts-rowghost, .ts-rowghost:focus-visible { opacity: 1; }
  .ts-table-empty { padding: 30px 0; border-top: 1px solid var(--border); }
  .ts-weekrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 8px 8px; }
  .ts-week-label { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em; color: var(--ink); text-transform: uppercase; }
  .ts-week-meta { font-size: 11.5px; color: var(--muted); }
  .ts-week-meta strong { color: var(--text); font-family: var(--display); }

  /* photos / chapters mini */
  .ts-photogrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ts-chlist { display: flex; flex-direction: column; gap: 13px; }
  .ts-chrow { display: grid; grid-template-columns: 120px 1fr 26px; align-items: center; gap: 11px; }
  .ts-chname { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-chtrack { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .ts-chfill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .ts-chn { font-family: var(--display); font-weight: 700; font-size: 13px; text-align: right; }

  /* ── UI primitives ────────────────────────────────── */
  .ui-avatar { border-radius: 99px; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 700; flex: 0 0 auto; }
  .ui-tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 99px; white-space: nowrap; }
  .ui-tag--sm { font-size: 11px; padding: 3px 9px; }
  .ui-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ui-status-dot { width: 8px; height: 8px; border-radius: 99px; }
  .ui-photo { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
  .ui-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .ui-photo svg { display: block; width: 100%; height: 100%; }
  .ui-photo-tag { position: absolute; left: 9px; bottom: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; letter-spacing: .03em; color: var(--muted); background: color-mix(in oklab, var(--surface) 82%, transparent); padding: 2px 7px; border-radius: 6px; }

  /* fields */
  .ui-field { display: flex; flex-direction: column; gap: 6px; }
  .ui-label { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .ui-req { color: var(--accent); margin-left: 3px; }
